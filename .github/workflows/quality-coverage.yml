# Coverage is reported, not used as a synthetic 100% gate before a measured baseline exists.
name: Rust coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    name: LLVM workspace coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Run instrumented workspace tests and capture LCOV
        run: cargo llvm-cov --workspace --locked --lcov --output-path coverage.lcov
      - name: Capture structured coverage report
        run: cargo llvm-cov report --json --output-path coverage.json
      - name: Upload measured coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage-${{ github.sha }}
          path: |
            coverage.lcov
            coverage.json
          if-no-files-found: warn
          retention-days: 14
